<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0a09" />
    <meta name="description" content="Warband and campaign manager for Mordheim, including Border Town Burning." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mordheim" />
    <!-- Spec §5.2 / §12.4. Self-hosted (scripts/fetch-fonts.mjs) rather than the
         Google CDN, so the Rulebook look survives offline and on flaky
         game-store wifi, and no third-party request is made. `font-display:swap`
         in fonts.css shows fallback text rather than nothing during the fetch;
         the two dominant above-the-fold faces (body + UI) are preloaded. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/alegreya-400-normal-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/alegreya-sans-400-normal-latin.woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <title>Mordheim Campaign Manager</title>
    <script>
      // Runs before the first paint so a parchment user never sees a flash of
      // the dark theme. Deliberately duplicates the key from src/lib/theme.ts:
      // pulling in a module here would defeat the point by deferring it.
      (function () {
        try {
          var t = localStorage.getItem('mordheim.theme');
          if (t !== 'grimdark' && t !== 'parchment') t = 'grimdark';
          document.documentElement.setAttribute('data-theme', t);
          if (t === 'grimdark') document.documentElement.classList.add('dark');
          else document.documentElement.classList.remove('dark');
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', t === 'parchment' ? '#e9e0cc' : '#0b0a09');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'grimdark');
        }
      })();
    </script>
  </head>
  <body class="bg-ink-950 text-bone-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
